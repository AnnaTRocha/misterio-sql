<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/avaliacao.css">
  <link rel="stylesheet" href="assets/accessibility.css">
  <script src="js/accessibility.js" defer></script>
  <script type="module" src="js/avaliacao.js"></script>
</head>
<body class="assessment-body">
  <header class="assessment-nav">
    <a class="assessment-brand" href="dashboard.html"><span>SQL</span> Área de aprendizagem</a>
    <a class="assessment-back" href="dashboard.html">← Voltar às atividades</a>
  </header>
  <main class="assessment-page">
    <div class="assessment-heading">
      <div><span class="assessment-eyebrow">AVALIAÇÃO INDIVIDUAL <span aria-hidden="true"> / </span> SQL</span>
        <h1>Consultas em um <em>marketplace.</em></h1>

      <h2 id="confirmationTitle">Enviar avaliação?</h2>
      <p id="confirmationMessage"></p>
      <div class="assessment-dialog-actions">
        <button type="submit" value="cancel" autofocus>Continuar revisando</button>
        <button type="submit" value="confirm" id="confirmationAccept">Enviar avaliação</button>

    </form>
