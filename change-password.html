<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nova senha — Mistério SQL</title>
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="js/change-password.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell single">
    <section class="auth-card">
      <h2>Crie sua nova senha</h2>
      <p>A senha temporária precisa ser substituída antes de continuar.</p>
      <div id="message"></div>
      <form id="changeForm">
        <label>Nova senha<input type="password" name="password" minlength="6" required></label>
        <label>Confirmar senha<input type="password" name="confirm" minlength="6" required></label>
        <button class="primary-btn" type="submit">Salvar nova senha</button>
      </form>
    </section>
  </main>
</body>
</html>
